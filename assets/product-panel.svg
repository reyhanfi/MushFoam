<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none">
  <defs>
    <linearGradient id="panel-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8CFC0"/>
      <stop offset="50%" stop-color="#C9BFB0"/>
      <stop offset="100%" stop-color="#B8AFA0"/>
    </linearGradient>
    <linearGradient id="panel-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A89B8A"/>
      <stop offset="100%" stop-color="#8C7F6E"/>
    </linearGradient>
    <linearGradient id="panel-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#998C7B"/>
      <stop offset="100%" stop-color="#7A6E5E"/>
    </linearGradient>
    <linearGradient id="wax-sheen" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Isometric flat panel — top face -->
  <polygon points="180,40 310,112 180,184 50,112" fill="url(#panel-top)" stroke="#C0B4A2" stroke-width="0.8" filter="url(#drop-shadow)"/>

  <!-- Beeswax sheen on top -->
  <polygon points="180,40 310,112 180,184 50,112" fill="url(#wax-sheen)"/>

  <!-- Left face -->
  <polygon points="50,112 180,184 180,210 50,138" fill="url(#panel-left)" stroke="#9A8E7D" stroke-width="0.8"/>

  <!-- Right face -->
  <polygon points="180,184 310,112 310,138 180,210" fill="url(#panel-right)" stroke="#8A7E6D" stroke-width="0.8"/>

  <!-- Organic texture lines on top — mycelium fiber effect -->
  <line x1="110" y1="72" x2="250" y2="142" stroke="#C8BDA8" stroke-width="0.9" opacity="0.55"/>
  <line x1="88"  y1="90" x2="228" y2="160" stroke="#C8BDA8" stroke-width="0.9" opacity="0.40"/>
  <line x1="135" y1="58" x2="275" y2="128" stroke="#C8BDA8" stroke-width="0.9" opacity="0.35"/>

  <!-- Vertical fiber lines -->
  <line x1="150" y1="65" x2="125" y2="158" stroke="#C0B5A2" stroke-width="0.75" opacity="0.30"/>
  <line x1="200" y1="55" x2="175" y2="155" stroke="#C0B5A2" stroke-width="0.75" opacity="0.30"/>
  <line x1="240" y1="80" x2="215" y2="165" stroke="#C0B5A2" stroke-width="0.75" opacity="0.25"/>

  <!-- Dimension label -->
  <text x="180" y="232" text-anchor="middle" font-family="'Satoshi',sans-serif" font-size="11" fill="#8FA890" font-weight="700" letter-spacing="1">60 × 40 cm</text>

  <!-- Small green eco dot -->
  <circle cx="180" cy="112" r="4" fill="#52B788" opacity="0.7"/>
  <circle cx="180" cy="112" r="7" fill="none" stroke="#52B788" stroke-width="1" opacity="0.3"/>
</svg>
