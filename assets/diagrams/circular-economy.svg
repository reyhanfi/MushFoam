<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none">
  <!-- Minimal 4-node circular economy diagram -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#52B788"/>
    </marker>
  </defs>

  <!-- Ring -->
  <circle cx="260" cy="190" r="115" stroke="#D4E8DC" stroke-width="2" fill="none" stroke-dasharray="10 6"/>

  <!-- Connecting arcs with arrows -->
  <path d="M 260 75 A 115 115 0 0 1 375 190" stroke="#52B788" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 375 190 A 115 115 0 0 1 260 305" stroke="#52B788" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 260 305 A 115 115 0 0 1 145 190" stroke="#52B788" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 145 190 A 115 115 0 0 1 260 75" stroke="#52B788" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Center hub -->
  <circle cx="260" cy="190" r="52" fill="#F6FBF8" stroke="#B4D8C4" stroke-width="1.5"/>
  <text x="260" y="185" text-anchor="middle" font-family="'Satoshi',sans-serif" font-weight="800" font-size="13" fill="#1B4332">ZERO</text>
  <text x="260" y="201" text-anchor="middle" font-family="'Satoshi',sans-serif" font-weight="800" font-size="13" fill="#1B4332">WASTE</text>

  <!-- Node 1: Top — Limbah Pertanian -->
  <circle cx="260" cy="65" r="38" fill="#fff" stroke="#B4D8C4" stroke-width="1.5"/>
  <text x="260" y="59" text-anchor="middle" font-family="'Satoshi',sans-serif" font-weight="700" font-size="10" fill="#2D6A4F">Limbah</text>
  <text x="260" y="72" text-anchor="middle" font-family="'Satoshi',sans-serif" font-weight="700" font-size="10" fill="#2D6A4F">Pertanian</text>

  <!-- Node 2: Right — Bio-Fabrikasi -->
  <circle cx="385" cy="190" r="38" fill="#fff" stroke="#B4D8C4" stroke-width="1.5"/>
  <text x="385" y="184" text-anchor="middle" font-family="'Satoshi',sans-serif" font-weight="700" font-size="10" fill="#2D6A4F">Bio-</text>
  <text x="385" y="197" text-anchor="middle" font-family="'Satoshi',sans-serif" font-weight="700" font-size="10" fill="#2D6A4F">Fabrikasi</text>

  <!-- Node 3: Bottom — Produk -->
  <circle cx="260" cy="315" r="38" fill="#fff" stroke="#B4D8C4" stroke-width="1.5"/>
  <text x="260" y="309" text-anchor="middle" font-family="'Satoshi',sans-serif" font-weight="700" font-size="10" fill="#2D6A4F">Produk</text>
  <text x="260" y="322" text-anchor="middle" font-family="'Satoshi',sans-serif" font-weight="700" font-size="10" fill="#2D6A4F">MushFoam</text>

  <!-- Node 4: Left — Kompos -->
  <circle cx="135" cy="190" r="38" fill="#fff" stroke="#B4D8C4" stroke-width="1.5"/>
  <text x="135" y="184" text-anchor="middle" font-family="'Satoshi',sans-serif" font-weight="700" font-size="10" fill="#2D6A4F">Kompos</text>
  <text x="135" y="197" text-anchor="middle" font-family="'Satoshi',sans-serif" font-weight="700" font-size="10" fill="#2D6A4F">Alami</text>
</svg>
